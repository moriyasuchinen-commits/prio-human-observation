name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Restore original GIF assets
        run: |
          cat .gif-source-v5/prio-assets.tar.gz.part-* | base64 --decode > /tmp/prio-assets.tar.gz
          tar -xzf /tmp/prio-assets.tar.gz -C .
          rm -rf .gif-source .gif-source-v2 .gif-source-v3 .gif-source-v4 .gif-source-v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
