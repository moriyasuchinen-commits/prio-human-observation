<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00b5c8" />
    <meta name="description" content="プリオのニンゲン観察ラボ。質問を通して、みんなの働き方や考え方に出会う会話ゲーム。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/prio/doctor/doctor2_S.png" />
    <link rel="stylesheet" href="style.css" />
    <title>プリオのニンゲン観察ラボ</title>
  </head>
  <body>
    <main class="game-shell">
      <div class="lab-grid" aria-hidden="true"></div>
      <svg class="lab-motif lab-motif--flask" viewBox="0 0 100 100" aria-hidden="true"><path class="flask-outline" d="M42 13h16M45 13v26L25 75a11 11 0 0 0 10 16h30a11 11 0 0 0 10-16L55 39V13"/><path class="flask-liquid" d="M29 73c10-4 21 3 42-1l4 7a7 7 0 0 1-7 9H32a7 7 0 0 1-6-10z"/><path class="flask-wave" d="M31 74c10-4 21 3 41-1"/><circle class="flask-bubble" cx="61" cy="61" r="3"/><circle class="flask-bubble" cx="67" cy="68" r="2"/></svg>
      <svg class="lab-motif lab-motif--report" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="16" width="56" height="70" rx="7"/><path d="M36 35l5 5 9-11M55 35h11M36 57l5 5 9-11M55 57h11M36 75h29"/></svg>
      <svg class="lab-motif lab-motif--chart" viewBox="0 0 120 80" aria-hidden="true"><path d="M12 67V13M12 67h96M28 55l20-19 18 10 27-28"/><circle cx="28" cy="55" r="3"/><circle cx="48" cy="36" r="3"/><circle cx="66" cy="46" r="3"/><circle cx="93" cy="18" r="3"/></svg>
      <svg class="lab-motif lab-motif--molecule" viewBox="0 0 120 100" aria-hidden="true"><path d="M22 62L54 34l36 18M54 34l8 42"/><circle cx="22" cy="62" r="7"/><circle cx="54" cy="34" r="7"/><circle cx="90" cy="52" r="7"/><circle cx="62" cy="76" r="7"/></svg>
      <div class="ambient ambient--one" aria-hidden="true">✦</div>
      <div class="ambient ambient--two" aria-hidden="true">?</div>
      <div class="ambient ambient--three" aria-hidden="true">✦</div>

      <section id="intro-screen" class="screen screen--intro is-active" aria-labelledby="game-title">
        <header class="brand-lockup">
          <h1 id="game-title">プリオの<br />ニンゲン観察ラボ</h1>
        </header>

        <div class="character-stage character-stage--intro">
          <span class="orbit orbit--left" aria-hidden="true"></span>
          <span class="orbit orbit--right" aria-hidden="true"></span>
          <span class="status-spark spark--one" aria-hidden="true">✦</span>
          <span class="status-spark spark--two" aria-hidden="true">!</span>
          <img class="prio-image" src="assets/prio/doctor/doctor2_S.gif" alt="白衣姿のプリオ" />
        </div>

        <div class="dialogue-card dialogue-card--intro">
          <p class="speaker-label"><span>●</span> AI観察員 プリオ</p>
          <p class="dialogue-text">こんにちは、ぼくプリオ！ここは、ぼくのニンゲン観察ラボだよ。AIのぼくには「会社」っていう概念がないんだ。ニンゲンの世界のみんなが、どんな風に働いたりコミュニケーションを取ったりしてるのか、もっと知りたいな！ぼくの質問に答えてみて！</p>
        </div>

        <button id="start-button" class="game-button game-button--primary" type="button">
          <span class="button-icon" aria-hidden="true">▶</span> 質問をはじめる！
        </button>
      </section>

      <section id="play-screen" class="screen screen--play" aria-live="polite" aria-labelledby="question-title" hidden>
        <header class="play-header">
          <button id="home-button" class="home-button" type="button">ラボにもどる</button>
          <p class="mini-brand">プリオからの質問</p>
        </header>

        <div class="category-wrap">
          <span id="category-badge" class="category-badge">日常</span>
        </div>

        <div class="character-stage character-stage--play">
          <span class="scan-ring scan-ring--one" aria-hidden="true"></span>
          <span class="scan-ring scan-ring--two" aria-hidden="true"></span>
          <span class="status-spark spark--three" aria-hidden="true">✦</span>
          <img id="question-image" class="prio-image" src="assets/prio/smile/smile_S.gif" alt="質問をするプリオ" />
        </div>

        <div id="question-card" class="dialogue-card dialogue-card--question">
          <p class="speaker-label"><span>✦</span> ニンゲンに質問！</p>
          <h2 id="question-title">好きなおにぎりの具は何？理由も教えて！</h2>
        </div>

        <div class="action-area">
          <button id="next-button" class="game-button game-button--primary" type="button">次の質問へ <span class="button-icon" aria-hidden="true">▶</span></button>
        </div>
      </section>

      <footer class="site-footer"><a href="https://www.libinc.co.jp/service/#libz" target="_blank" rel="noopener noreferrer">運営元LIBZについて <span aria-hidden="true">↗</span></a></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
